<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia - Bố cục mô phỏng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 1. HEADER (Tên trang) -->
        <header class="header">
            <h1>WIKIPEDIA</h1>
            <p>The Free Encyclopedia</p>
        </header>

        <!-- 2. NAVIGATION (Logo & Các ngôn ngữ xung quanh) -->
        <nav class="languages">
            <div class="lang-box">
                <a href="#">English</a>
                <a href="#">Español</a>
            </div>
            
            <!-- Logo quả cầu ở giữa -->
            <div class="logo">
                <img src="https://picsum.photos/200/200" alt="Wikipedia Logo">
            </div>

            <div class="lang-box">
                <a href="#">日本語</a>
                <a href="#">Français</a>
            </div>
        </nav>

        <!-- 3. CONTENT SECTION (O Tìm kiếm) -->
        <section class="search-section">
            <input type="text" placeholder="Tìm kiếm trên Wikipedia...">
            <button>Tìm kiếm</button>
        </section>

        <!-- 4. FOOTER -->
        <footer class="footer">
            <button class="btn-lang">Đọc Wikipedia bằng ngôn ngữ của bạn</button>
        </footer>
    </div>

</body>
</html>
